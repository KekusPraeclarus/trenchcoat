name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          # Must outlive install wait-idle (30m) + build; default 10m orphaned
          # deploy-pause + stopped timers when SSH was killed mid-wait (2026-07-23).
          command_timeout: 40m
          # Prefer authorized_keys command=/…/trenchcoat-deploy when set; this
          # script is the fallback when the key is not forced.
          script: |
            set -euo pipefail
            export PATH="$HOME/.trenchcoat/bin:$HOME/bin:$HOME/.local/bin:$PATH"
            export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
            exec "$HOME/bin/trenchcoat-deploy"
